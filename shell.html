<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root{
    --bg:#f3f0e9; --card:#fffdf8; --ink:#20242c; --ink2:#4a5260; --muted:#7b8392;
    --line:#e4ded1; --line2:#d3cab8;
    --brand:#2c4a6e; --brand2:#3b6ea5; --brand-bg:#e9eef6;
    --amber:#96570f; --amber-bg:#fbf0dd;
    --green:#226b47; --green-bg:#e7f4ec;
    --red:#a33a3a; --red-bg:#faecea;
    --purple:#5a3f96; --purple-bg:#efeafa;
    --teal:#0e6b70; --teal-bg:#e4f3f4;
    --mono:#646d7c;
    --serif:Georgia,"Times New Roman","Noto Serif SC",serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth; scroll-padding-top:24px}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC",-apple-system,"Helvetica Neue",Arial,sans-serif;
    line-height:1.78; font-size:16px; -webkit-font-smoothing:antialiased;
  }
  ::selection{background:#cddcf0}
  a{color:var(--brand2); text-decoration:none}
  a:hover{text-decoration:underline}
  .skip{position:absolute;left:-9999px;top:0;background:var(--brand);color:#fff;padding:8px 14px;z-index:200}
  .skip:focus{left:8px;top:8px}
  #progress{position:fixed;left:0;top:0;height:3px;width:0;background:linear-gradient(90deg,var(--brand2),var(--teal));z-index:120}

  /* ============ layout ============ */
  .layout{max-width:1400px; margin:0 auto; padding:28px 32px 100px; display:grid;
    grid-template-columns:252px minmax(0,1fr); gap:40px}
  .side{position:sticky; top:24px; align-self:start; max-height:calc(100vh - 48px); overflow:auto;
    padding-right:6px; font-size:13.5px}
  .side::-webkit-scrollbar{width:6px}
  .side::-webkit-scrollbar-thumb{background:#d8d1c3;border-radius:3px}
  .side-head{padding:2px 0 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
  .brand{display:flex;gap:8px;align-items:center;font-weight:700;color:var(--ink);font-size:14px;letter-spacing:.01em}
  .brand:hover{text-decoration:none;color:var(--brand)}
  .brand-mark{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;
    background:var(--brand);color:#fff;font:600 14px/1 var(--serif)}
  .side-sub{color:var(--muted);font-size:12px;margin:6px 0 0 32px}
  .side nav{display:flex;flex-direction:column;gap:1px}
  .side nav a{display:flex;gap:8px;align-items:baseline;padding:7px 9px;border-radius:8px;
    color:var(--ink2);line-height:1.35;border-left:2px solid transparent}
  .side nav a:hover{background:#ece8de;text-decoration:none;color:var(--ink)}
  .side nav a.active{background:var(--brand-bg);color:var(--brand);border-left-color:var(--brand);font-weight:600}
  .side nav .n{font:600 10.5px/1 var(--mono);color:var(--muted);letter-spacing:.04em;min-width:18px;text-align:right}
  .side nav a.active .n{color:var(--brand)}
  .side-foot{display:grid;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .mini{font:inherit;font-size:12.5px;color:var(--ink2);background:#fffdf8;border:1px solid var(--line2);
    border-radius:8px;padding:6px 9px;cursor:pointer;text-align:left}
  .mini:hover{border-color:var(--brand2);color:var(--brand)}
  main{min-width:0;max-width:1000px}

  /* ============ hero ============ */
  .hero{position:relative;background:
      radial-gradient(900px 300px at 85% -10%,rgba(120,170,220,.28),transparent 60%),
      linear-gradient(135deg,#22364e 0%,#2c4a6e 58%,#31577f 100%);
    color:#f2f6fb;border-radius:22px;padding:40px 42px 34px;margin:0 0 28px;overflow:hidden;
    box-shadow:0 18px 40px -28px rgba(20,35,55,.7)}
  .hero::after{content:"";position:absolute;right:-70px;bottom:-90px;width:260px;height:260px;border:1px solid rgba(255,255,255,.13);
    border-radius:50%}
  .hero .eyebrow{font:600 12px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#a9c3de}
  .hero h1{margin:12px 0 6px;font-size:34px;line-height:1.25;letter-spacing:-.01em;font-weight:750}
  .hero h1 .zh{display:block;font-size:21px;font-weight:500;color:#c4d5e8;margin-top:5px;letter-spacing:.02em}
  .hero .subtitle{margin:10px 0 0;color:#c6d5e5;font-size:15.5px;max-width:62ch}
  .hero .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
  .hero .chip{font-size:12.5px;color:#dbe7f3;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);
    border-radius:999px;padding:3px 11px;backdrop-filter:blur(2px)}
  .hero .chip b{color:#fff;font-weight:600}
  .hero .hero-eq{margin-top:20px;padding:12px 16px;border-left:3px solid rgba(255,255,255,.45);
    background:rgba(0,0,0,.14);border-radius:0 10px 10px 0;font-family:var(--serif);font-size:17px;color:#fff;overflow-x:auto;white-space:nowrap}
  .hero .hero-eq .cap{display:block;font-family:inherit;font-size:12.5px;color:#a9c3de;white-space:normal;margin-bottom:2px;letter-spacing:.02em}

  /* ============ cards ============ */
  section.card{background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:30px 34px;margin:0 0 26px;box-shadow:0 1px 0 rgba(32,36,44,.02),0 10px 26px -22px rgba(32,36,44,.28)}
  section.card > h2:first-child{margin-top:0}
  .sec-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:6px}
  .sec-no{flex:0 0 auto;display:grid;place-items:center;width:38px;height:38px;border-radius:11px;
    background:var(--brand-bg);color:var(--brand);font:700 14px/1 var(--mono);margin-top:2px}
  h2{font-size:25px;line-height:1.35;margin:0 0 6px;letter-spacing:-.01em}
  h2 .n{display:inline-block;font:700 12px/1 var(--mono);letter-spacing:.06em;color:var(--brand2);
    background:var(--brand-bg);border-radius:6px;padding:5px 7px;margin-right:10px;vertical-align:3px}
  h2 .en{display:block;font:500 13px/1.4 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:5px}
  h3{font-size:18.5px;margin:34px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line);letter-spacing:-.005em}
  h3 .en{font:500 12px/1.4 var(--mono);color:var(--muted);letter-spacing:.05em;margin-left:8px;text-transform:uppercase}
  h4{font-size:15.5px;margin:20px 0 6px;color:var(--ink)}
  p{margin:10px 0}
  .sec-lede{font-size:15.5px;color:var(--ink2);border-left:3px solid var(--line2);padding-left:14px;margin:14px 0 22px}
  .lede{font-size:16px;color:var(--ink2)}
  .small{font-size:13.5px;color:var(--muted)}
  ul,ol{margin:10px 0;padding-left:22px}
  li{margin:5px 0}
  ul.tight li,ol.tight li{margin:2px 0}

  /* ============ chip / tag ============ */
  .tag{display:inline-block;font:600 11.5px/1.6 var(--mono);letter-spacing:.04em;padding:0 9px;border-radius:999px;
    background:var(--brand-bg);color:var(--brand);border:1px solid #cfdaea;margin-right:6px;vertical-align:1px}
  .tag.amber{background:var(--amber-bg);color:var(--amber);border-color:#ecd6b2}
  .tag.green{background:var(--green-bg);color:var(--green);border-color:#bfe0cd}
  .tag.red{background:var(--red-bg);color:var(--red);border-color:#e8c3bf}
  .tag.purple{background:var(--purple-bg);color:var(--purple);border-color:#d7cbf0}
  .tag.teal{background:var(--teal-bg);color:var(--teal);border-color:#bfe0e1}
  .src{font:500 11.5px/1.6 var(--mono);color:var(--muted);background:#f1ede4;border:1px solid var(--line);
    border-radius:5px;padding:0 6px;white-space:nowrap}

  /* ============ bilingual ============ */
  .term{display:inline-flex;align-items:baseline;gap:6px;background:var(--brand-bg);border:1px solid #cfdaea;
    border-radius:999px;padding:0 10px;margin:0 2px;font-size:14px;line-height:1.9;white-space:nowrap;vertical-align:1px}
  .term b{color:var(--brand);font-weight:650}
  .term i{font-style:normal;color:var(--ink2);font-size:13px}
  .en-line{font-family:var(--serif);font-size:15.3px;line-height:1.7;color:#363e4b;background:#f8f6ef;
    border-left:3px solid var(--line2);padding:9px 13px;border-radius:0 9px 9px 0;margin:12px 0}
  .en-line b{color:var(--brand);font-weight:650}
  .en-line .zh{display:block;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:13.6px;color:var(--muted);margin-top:4px;line-height:1.65}
  .en-line .zh b{color:var(--ink2);font-weight:600}
  .def{border:1px solid var(--line);border-radius:13px;padding:15px 17px;margin:16px 0;background:#fbfaf5}
  .def .t{font:700 11px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--purple);margin-bottom:6px}
  .def .en{font-family:var(--serif);font-size:15px;color:#2f3743;line-height:1.7}
  .def .zh{font-size:14.3px;color:var(--ink2);margin-top:7px;padding-top:7px;border-top:1px dashed var(--line2)}
  .def .zh b{color:var(--ink)}

  /* ============ equations ============ */
  .eq{font-family:"Cambria Math",Cambria,var(--serif);font-size:17.5px;margin:14px 0;overflow-x:auto;overflow-y:hidden;
    white-space:nowrap;padding:2px 0;line-height:1.9}
  .eq.block{background:#fbfaf5;border:1px solid var(--line);border-left:4px solid var(--brand2);
    border-radius:10px;padding:14px 18px;white-space:normal}
  .eq.key{border-left-color:var(--amber);background:#fffaf0}
  .eq.ans{border-left-color:var(--green);background:#f2faf5}
  .eq i,.eq var{font-style:italic}
  .eq .op{font-style:normal;padding:0 1px}
  .eq .num{font-style:normal}
  .eq .hl{background:#fff0c2;padding:0 2px;border-radius:3px}
  .eq .cap{display:block;font:500 11.5px/1.5 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  sub,sup{font-size:.72em;line-height:0}
  .frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;transform:translateY(-.08em)}
  .frac > .n{display:block;padding:0 5px;border-bottom:1.4px solid currentColor;line-height:1.3}
  .frac > .d{display:block;padding:0 5px;line-height:1.3}
  .sqrt{display:inline-block;position:relative;padding-left:.62em}
  .sqrt::before{content:"√";position:absolute;left:0;top:-.02em;font-size:1.18em}
  .sqrt > .rad{border-top:1.4px solid currentColor;padding:1px 3px 0;display:inline-block}
  .abs{border-left:1.2px solid currentColor;border-right:1.2px solid currentColor;padding:0 3px}
  .vec{position:relative}
  .vec::after{content:"→";position:absolute;left:0;right:0;top:-.62em;font-size:.8em;text-align:center}

  /* ============ tables ============ */
  table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14.2px}
  th,td{border:1px solid var(--line);padding:9px 11px;vertical-align:top;text-align:left}
  th{background:#f2eee5;font-weight:650;font-size:13.2px;color:var(--ink2)}
  tr:nth-child(even) td{background:#fcfaf4}
  td .eq{margin:3px 0;font-size:15px;white-space:normal}
  td ul{margin:2px 0;padding-left:18px}

  /* ============ callouts ============ */
  .note{border-radius:12px;padding:13px 16px 13px 17px;margin:16px 0;border:1px solid;font-size:14.6px;line-height:1.75;position:relative}
  .note b:first-child{display:inline-block;font-weight:700;margin-right:4px}
  .note.warn{background:var(--red-bg);border-color:#ecc7c2;border-left:4px solid var(--red)}
  .note.warn b:first-child{color:var(--red)}
  .note.tip{background:var(--green-bg);border-color:#bfe0cd;border-left:4px solid var(--green)}
  .note.tip b:first-child{color:var(--green)}
  .note.info{background:var(--brand-bg);border-color:#cfdaea;border-left:4px solid var(--brand2)}
  .note.info b:first-child{color:var(--brand)}
  .note.def{background:var(--purple-bg);border-color:#d7cbf0;border-left:4px solid var(--purple)}
  .note.def b:first-child{color:var(--purple)}
  .note.amber{background:var(--amber-bg);border-color:#ecd6b2;border-left:4px solid var(--amber)}
  .note.amber b:first-child{color:var(--amber)}
  .note p{margin:4px 0}

  .takeaway{font-size:17.5px;line-height:1.75;color:var(--ink);background:linear-gradient(180deg,#fdf8ea,#fbf3dd);
    border:1px solid #ecd9ae;border-radius:14px;padding:18px 20px;margin:18px 0}
  .takeaway .lab{display:block;font:700 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-bottom:7px}

  /* ============ objectives / checklist ============ */
  .objectives{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:18px 0}
  .obj{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:#fcfaf4}
  .obj .k{font:700 10.5px/1 var(--mono);letter-spacing:.1em;color:var(--brand2);text-transform:uppercase}
  .obj p{margin:6px 0 0;font-size:14.3px;color:var(--ink2)}
  .checklist{display:grid;gap:9px;margin:14px 0}
  .checklist label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);
    border-radius:10px;background:#fff;cursor:pointer;font-size:14.6px}
  .checklist input{margin-top:5px;accent-color:var(--brand);width:15px;height:15px;flex:0 0 auto}
  .checklist label:has(input:checked){background:#f2f7f3;border-color:#c6ddcc;color:var(--muted)}
  .checklist label:has(input:checked) span{text-decoration:line-through;text-decoration-color:#b9c9be}

  /* ============ roadmap / formula strip ============ */
  .roadmap{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:16px 0}
  .roadmap .rm{flex:1 1 160px;min-width:140px;border:1px solid var(--line);border-radius:10px;background:#fbfaf5;padding:9px 12px}
  .roadmap .rm b{display:block;font-size:13.8px;color:var(--ink)}
  .roadmap .rm span{display:block;font-size:12.4px;color:var(--muted);margin-top:2px}
  .roadmap .ar{color:var(--line2);font-size:16px;flex:0 0 auto}
  .fstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:8px;margin:14px 0}
  .fstrip .fs{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:#fff;font-size:13px}
  .fstrip .fs b{display:block;font:700 10px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--brand2);margin-bottom:2px}
  .fstrip .fs .eq{font-size:14px;margin:0;white-space:normal}

  /* ============ derivation steps ============ */
  ol.steps{list-style:none;margin:18px 0;padding:0}
  ol.steps > li{position:relative;padding:0 0 18px 46px}
  ol.steps > li::before{counter-increment:step;content:counter(step);position:absolute;left:0;top:0;width:30px;height:30px;
    border-radius:50%;background:var(--brand);color:#fff;font:650 13.5px/30px var(--mono);text-align:center}
  ol.steps{counter-reset:step}
  ol.steps > li::after{content:"";position:absolute;left:14px;top:34px;bottom:0;width:2px;background:var(--line)}
  ol.steps > li:last-child::after{display:none}
  ol.steps > li > p:first-child{margin-top:3px}
  ol.steps .why{margin-top:5px;font-size:13.5px;color:var(--muted);background:#f6f3ea;border-radius:7px;padding:5px 10px}
  ol.steps .why b{color:var(--brand);font-weight:650}

  /* ============ example ============ */
  .example{border:1px solid var(--line);border-radius:15px;margin:26px 0;overflow:hidden;background:#fffefa}
  .example > header{display:flex;align-items:center;gap:10px;padding:12px 18px;background:#f5f0e4;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .ex-badge{font:700 11.5px/1.6 var(--mono);letter-spacing:.07em;background:var(--brand);color:#fff;border-radius:5px;padding:1px 8px}
  .ex-title{font-weight:650;font-size:15px;flex:1 1 auto;min-width:180px}
  .stars{color:var(--amber);letter-spacing:2px;font-size:12px}
  .example .q{padding:16px 18px 6px}
  .q-en{font-family:var(--serif);font-size:15.2px;line-height:1.72;color:#2c333e;margin:0}
  .q-zh{font-size:14.2px;color:var(--muted);margin:8px 0 0;padding-top:8px;border-top:1px dashed var(--line)}
  .q-zh b{color:var(--ink2)}
  .hint{margin:10px 18px 0;font-size:13.6px;color:var(--amber);background:var(--amber-bg);border-radius:8px;padding:6px 11px}
  details.sol{margin:12px 18px 16px;border:1px dashed var(--line2);border-radius:11px;background:#fcfbf6}
  details.sol > summary{cursor:pointer;padding:10px 14px;font-weight:600;color:var(--brand);font-size:14.3px;list-style:none;display:flex;align-items:center;gap:8px}
  details.sol > summary::-webkit-details-marker{display:none}
  details.sol > summary::before{content:"▸";transition:transform .15s;display:inline-block;color:var(--brand2)}
  details.sol[open] > summary::before{transform:rotate(90deg)}
  .sol-body{padding:2px 16px 14px;border-top:1px dashed var(--line)}
  .sol-body p{margin:7px 0}
  .sol-step{display:grid;grid-template-columns:26px 1fr;gap:8px;margin:9px 0}
  .sol-step .sn{font:700 12px/22px var(--mono);color:var(--brand2);text-align:center;background:var(--brand-bg);border-radius:5px;height:22px}
  .answer{margin:12px 0 4px;background:var(--green-bg);border:1px solid #bfe0cd;border-radius:9px;padding:9px 13px;font-size:15px}
  .answer b{color:var(--green)}
  .example footer{padding:10px 18px 14px;font-size:13.6px;color:var(--ink2);border-top:1px solid var(--line);background:#fdfbf5}
  .example footer b{color:var(--brand)}

  /* ============ figure ============ */
  figure{margin:20px 0;text-align:center}
  figure img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:12px;background:#fff;
    box-shadow:0 8px 20px -18px rgba(32,36,44,.5)}
  figcaption{font-size:12.8px;color:var(--muted);margin-top:7px}
  figcaption b{color:var(--ink2)}
  .fig-note{max-width:760px;margin:12px auto 0;text-align:left;font-size:13.8px;color:var(--ink2);
    background:#f7f4ec;border-radius:10px;padding:10px 14px}
  .fig-note b{color:var(--brand)}
  .fig-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;align-items:start}
  .fig-row figure{margin:0}

  /* ============ formula grid ============ */
  .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:13px;margin:16px 0}
  .fcard{border:1px solid var(--line);border-left:3px solid var(--brand2);border-radius:10px;background:#fff;padding:11px 14px}
  .fcard .fk{font:700 10.5px/1.4 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .fcard .ft{font-weight:650;font-size:14px;margin:2px 0 4px}
  .fcard .eq{margin:4px 0 0;font-size:15.5px;white-space:normal}
  .fcard.amber{border-left-color:var(--amber)} .fcard.green{border-left-color:var(--green)} .fcard.purple{border-left-color:var(--purple)}

  /* ============ quiz ============ */
  .quiz{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:18px 0;background:#fffefa}
  .quiz .qn{font:700 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--brand2);margin-bottom:6px}
  .quiz-q{font-weight:650;margin:0 0 11px;font-size:15px;line-height:1.6}
  .opts{display:grid;gap:7px}
  .opt{text-align:left;border:1px solid var(--line2);background:#fff;border-radius:9px;padding:9px 12px;
    font:inherit;font-size:14.4px;cursor:pointer;color:var(--ink);transition:border-color .12s,background .12s}
  .opt:hover{border-color:var(--brand2)}
  .opt.ok{background:var(--green-bg);border-color:#93c9aa}
  .opt.bad{background:var(--red-bg);border-color:#dfaca6}
  .opt:disabled{cursor:default}
  .quiz-fb{margin-top:11px;font-size:14px;color:var(--ink2);background:#f6f3ea;border-radius:8px;padding:8px 11px;display:none}
  .quiz-fb.show{display:block}
  .quiz-fb b{color:var(--brand)}

  /* ============ glossary ============ */
  table.gloss td:first-child{white-space:nowrap;font-weight:650;color:var(--brand);font-family:var(--serif)}
  table.gloss td:nth-child(2){white-space:nowrap}

  /* ============ misc ============ */
  .kv{font-size:14.4px}
  .kv b{display:inline-block;min-width:88px;color:var(--ink2);font-weight:650}
  .pill{display:inline-block;padding:0 9px;border-radius:999px;font-size:12.5px;font-weight:650}
  .pill.a{background:var(--brand-bg);color:var(--brand)} .pill.b{background:var(--green-bg);color:var(--green)}
  .pill.c{background:var(--amber-bg);color:var(--amber)} .pill.d{background:var(--purple-bg);color:var(--purple)}
  .pill.e{background:var(--teal-bg);color:var(--teal)}
  .divider{border:0;border-top:1px dashed var(--line2);margin:26px 0}
  .nowrap{white-space:nowrap}
  .center{text-align:center}

  /* ============ mobile nav ============ */
  .nav-toggle{display:none;position:fixed;right:18px;bottom:18px;z-index:110;width:46px;height:46px;border-radius:50%;
    background:var(--brand);border:0;color:#fff;box-shadow:0 8px 22px -8px rgba(30,50,80,.6);cursor:pointer}
  .nav-toggle span,.nav-toggle span::before,.nav-toggle span::after{display:block;width:18px;height:2px;background:#fff;margin:0 auto}
  .nav-toggle span{position:relative}
  .nav-toggle span::before,.nav-toggle span::after{content:"";position:absolute;left:0}
  .nav-toggle span::before{top:-6px} .nav-toggle span::after{top:6px}
  .scrim{display:none;position:fixed;inset:0;background:rgba(25,30,40,.4);z-index:100}

  @media (max-width:1020px){
    .layout{display:block;padding:18px 16px 90px}
    .side{position:fixed;left:0;top:0;bottom:0;width:280px;max-height:none;background:var(--card);
      z-index:105;padding:18px 16px;transform:translateX(-102%);transition:transform .22s ease;box-shadow:12px 0 40px -20px rgba(0,0,0,.35)}
    body.nav-open .side{transform:none}
    body.nav-open .scrim{display:block}
    .nav-toggle{display:block}
    .hero{padding:28px 24px 26px;border-radius:18px}
    .hero h1{font-size:27px}
    section.card{padding:22px 19px;border-radius:15px}
    h2{font-size:22px}
    body{font-size:15.4px}
  }
  @media (max-width:560px){
    .hero .chips{gap:6px}
    .example > header{padding:10px 13px}
    .q{padding:13px}
    .hint{margin:8px 13px 0}
    details.sol{margin:10px 13px 13px}
    .example footer{padding:9px 13px 12px}
    .roadmap{display:grid;grid-template-columns:1fr;gap:6px}
    .roadmap .ar{display:none}
  }

  /* ============ print ============ */
  @media print{
    @page{size:A4;margin:14mm 12mm}
    body{background:#fff;font-size:10.2pt;line-height:1.5}
    .layout{display:block;padding:0;max-width:none}
    .side,.nav-toggle,.scrim,#progress,.no-print{display:none!important}
    .hero{background:#fff!important;color:#111!important;border:1px solid #999;box-shadow:none;padding:12px 14px;border-radius:6px}
    .hero h1,.hero h1 .zh,.hero .subtitle,.hero .eyebrow,.hero .chip{color:#111!important}
    .hero .chip{background:#f4f4f4;border-color:#bbb;color:#222}
    .hero .chip b{color:#000}
    .hero .hero-eq{background:#f7f7f7;color:#111;border-left-color:#666}
    .hero .hero-eq .cap{color:#555}
    section.card{border:1px solid #aaa;box-shadow:none;border-radius:6px;padding:12px 14px;margin:0 0 10px;break-inside:auto}
    h2,h3{break-after:avoid}
    table,figure,.example,.quiz,.fcard,.def,.note{break-inside:avoid}
    .hero .hero-eq{white-space:normal}
    main{max-width:none}
    h2{font-size:14pt} h3{font-size:11.5pt;margin-top:12pt}
    .eq{font-size:11pt} .eq.block{padding:7px 9px}
    table{font-size:9pt} th,td{padding:4px 6px}
    .note{padding:7px 9px;font-size:9.5pt}
    details.sol{border:1px solid #bbb}
    details.sol > summary{color:#111}
    figure img{max-height:78mm}
    .example,.fcard,.quiz{break-inside:avoid}
    a{color:inherit;text-decoration:none}
  }
</style>
</head>
<body>
<a class="skip" href="#main">跳到正文</a>
<div id="progress"></div>
<button class="nav-toggle" id="navToggle" aria-label="打开目录" aria-expanded="false"><span></span></button>
<div class="scrim" id="scrim"></div>

<div class="layout">
  <aside class="side" id="side">
    <div class="side-head">
      <a class="brand" href="#top"><span class="brand-mark">§</span><span>{{COURSE}}</span></a>
      <div class="side-sub">{{LECTURE}}</div>
    </div>
    <nav id="toc" aria-label="本页目录">
      <a href="#top"><span class="n">↑</span><span>回到开头</span></a>
      {{NAV}}
    </nav>
    <div class="side-foot no-print">
      <button class="mini" id="expandAll" type="button">展开全部答案</button>
      <button class="mini" id="printBtn" type="button">打印 / 保存为 PDF</button>
    </div>
  </aside>

  <main id="main">
{{BODY}}
  </main>
</div>

<script>
(function(){
  var doc = document, body = doc.body;
  var progress = doc.getElementById('progress');
  var side = doc.getElementById('side');
  var links = Array.prototype.slice.call(doc.querySelectorAll('#toc a[href^="#"]'));
  var sections = Array.prototype.slice.call(doc.querySelectorAll('main section[id]'));

  /* reading progress */
  function paintProgress(){
    var h = doc.documentElement.scrollHeight - window.innerHeight;
    progress.style.width = (h > 0 ? Math.min(100, window.scrollY / h * 100) : 0) + '%';
  }

  /* scrollspy */
  var current = null;
  function paintSpy(){
    var y = window.scrollY + 120, found = null;
    for (var i = 0; i < sections.length; i++){
      if (sections[i].offsetTop <= y) found = sections[i];
    }
    var id = found ? found.id : 'top';
    if (id === current) return;
    current = id;
    links.forEach(function(a){
      var on = a.getAttribute('href') === '#' + id;
      a.classList.toggle('active', on);
      if (on) a.setAttribute('aria-current', 'true');
      else a.removeAttribute('aria-current');
    });
  }

  var ticking = false;
  function onScroll(){
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function(){ paintProgress(); paintSpy(); ticking = false; });
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  window.addEventListener('resize', onScroll);
  paintProgress(); paintSpy();

  /* mobile nav */
  var toggle = doc.getElementById('navToggle'), scrim = doc.getElementById('scrim');
  function closeNav(){ body.classList.remove('nav-open'); toggle.setAttribute('aria-expanded','false'); }
  toggle.addEventListener('click', function(){
    var open = body.classList.toggle('nav-open');
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  scrim.addEventListener('click', closeNav);
  links.forEach(function(a){ a.addEventListener('click', closeNav); });
  doc.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeNav(); });

  /* expand / collapse all solutions */
  var expandAll = doc.getElementById('expandAll');
  var details = Array.prototype.slice.call(doc.querySelectorAll('details'));
  expandAll.addEventListener('click', function(){
    var anyClosed = details.some(function(d){ return !d.open; });
    details.forEach(function(d){ d.open = anyClosed; });
    expandAll.textContent = anyClosed ? '收起全部答案' : '展开全部答案';
  });

  /* print */
  doc.getElementById('printBtn').addEventListener('click', function(){ window.print(); });
  window.addEventListener('beforeprint', function(){ details.forEach(function(d){ d.open = true; }); });
  window.addEventListener('afterprint', function(){
    expandAll.textContent = '展开全部答案';
  });

  /* quiz */
  doc.addEventListener('click', function(e){
    var opt = e.target.closest ? e.target.closest('.opt') : null;
    if (!opt) return;
    var quiz = opt.closest('.quiz');
    if (!quiz || quiz.dataset.done === '1') return;
    var ok = opt.dataset.ok === '1';
    var fb = quiz.querySelector('.quiz-fb');
    if (ok){
      opt.classList.add('ok');
      quiz.dataset.done = '1';
      quiz.querySelectorAll('.opt').forEach(function(b){ b.disabled = true; });
      fb.innerHTML = '<b>✓ 对了。</b> ' + (quiz.dataset.exp || '');
      fb.classList.add('show');
    } else {
      opt.classList.add('bad');
      opt.disabled = true;
      fb.innerHTML = '<b>再想想。</b> ' + (quiz.dataset.hint || '回到定义或上面那一步，看看漏了哪个条件。');
      fb.classList.add('show');
    }
  });

  /* checklist persistence */
  try {
    var boxes = doc.querySelectorAll('.checklist input[type=checkbox]');
    var key = 'cn:' + location.pathname + ':' + (doc.title || '');
    boxes.forEach(function(b, i){
      if (localStorage.getItem(key + ':' + i) === '1') b.checked = true;
      b.addEventListener('change', function(){
        localStorage.setItem(key + ':' + i, b.checked ? '1' : '0');
      });
    });
  } catch (err) { /* file:// may block localStorage in some browsers */ }
})();
</script>
</body>
</html>
